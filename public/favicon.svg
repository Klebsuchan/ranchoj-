<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- iFood Red Signature Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA1D2C" />
      <stop offset="100%" stop-color="#BA0C19" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Shopping Cart outline in bright white (iFood style) -->
  <g filter="url(#shadow)">
    <!-- Cart handle and basket -->
    <path d="M12 16h6l5.2 20.8c.3 1.2 1.4 2 2.6 2h19.4c1.2 0 2.3-.8 2.6-2l3.7-14.8H21" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Wheels -->
    <circle cx="26" cy="45" r="3.2" fill="#ffffff" />
    <circle cx="44" cy="45" r="3.2" fill="#ffffff" />

    <!-- iFood Smile smile arc inside cart -->
    <path d="M26 27c3 4 10 4 13 0" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linecap="round" />
  </g>
</svg>
